get_forecast:
  name: Get Solar Forecast
  description: >-
    Get the current solar forecast as two time series: instantaneous power in
    watts, and energy in watt-hours per 15 minute period. Timestamps are in the
    Home Assistant timezone.

  fields:
    config_entry:
      name: Config entry
      description: Config entry to get the forecast from.
      required: true
      selector:
        config_entry:
          integration: ml_solar_forecast

    start:
      name: Start
      description: Start timestamp (defaults to today at 00:00, local time).
      required: false
      example: "2026-03-01T00:00:00"
      selector:
        datetime: {}

    end:
      name: End
      description: End timestamp (defaults to 14 days after start).
      required: false
      example: "2026-03-15T00:00:00"
      selector:
        datetime: {}

    resolution:
      name: Resolution
      description: >-
        Resolution of the returned series. 'Raw' uses the native 15 minute
        resolution. 'Hourly' aggregates to whole-hour buckets.
      required: false
      default: raw
      selector:
        select:
          options:
            - raw
            - hourly
          translation_key: forecast_resolution